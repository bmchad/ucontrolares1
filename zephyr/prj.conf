CONFIG_GPIO=y
CONFIG_SERIAL=y

CONFIG_DYNAMIC_INTERRUPTS=y
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Habilita o subsistema de ADC do Zephyr
CONFIG_ADC=y

# Habilita funções de conversão de dados do ADC
CONFIG_ADC_ASYNC=y

# Ativa o suporte a Printk e Console Serial
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
